name: Dina
options:
  bundleIdPrefix: com.alexandre.dina
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Dina:
    type: application
    platform: iOS
    sources:
      - path: Dina
        excludes:
          - "**/.DS_Store"
    resources:
      - Dina/Resources/Assets.xcassets
    info:
      path: Dina/Resources/Info.plist
      properties:
        CKSharingSupported: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexandre.dina
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: Dinapp
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Dinapp affiche votre position sur la carte pour situer les escapades autour de vous."
        CODE_SIGN_ENTITLEMENTS: Dina/Resources/Dina.entitlements
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
    entitlements:
      path: Dina/Resources/Dina.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.alexandre.dina
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.alexandre.dina"
        aps-environment: development
